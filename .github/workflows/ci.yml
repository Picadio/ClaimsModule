name: Backend CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 9.0.x
          skip-lts-prepass: true

      - name: Restore dependencies
        run: dotnet restore ClaimsModule.sln

      - name: Build
        run: dotnet build ClaimsModule.sln --configuration Release --no-restore

      - name: Run tests with SQL Server
        shell: bash
        run: |
          set -euo pipefail
          password_suffix="$(openssl rand -hex 24)"
          export MSSQL_SA_PASSWORD="ClaimsCi1!${password_suffix}"
          printf '::add-mask::%s\n' "$MSSQL_SA_PASSWORD"

          sql_container="$(docker run --detach --rm \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD \
            --publish 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest)"
          trap 'docker stop --time 5 "$sql_container" >/dev/null 2>&1 || true' EXIT

          deadline=$((SECONDS + 120))
          until docker exec "$sql_container" sh -c '
            SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -C -b -l 3 -Q "SELECT 1"
          ' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              docker logs "$sql_container"
              exit 1
            fi
            sleep 2
          done

          export CLAIMS_TEST_SQL_SERVER="Server=127.0.0.1,1433;Database=master;User ID=sa;Password=$MSSQL_SA_PASSWORD;Encrypt=True;TrustServerCertificate=True"
          dotnet test ClaimsModule.sln --configuration Release --no-build --no-restore
