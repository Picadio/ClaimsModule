# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ClaimsModule

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish ClaimsModule API
        run: dotnet publish src/ClaimsModule.API/ClaimsModule.API.csproj --configuration Release --runtime linux-x64 --self-contained true --output publish

      - name: Build the EF Core migration WebJob
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          dotnet tool install dotnet-ef --tool-path "$RUNNER_TEMP/ef-tools" --version 9.0.23
          job_path="$PWD/publish/App_Data/jobs/triggered/claims-migrations"
          mkdir -p "$job_path"
          "$RUNNER_TEMP/ef-tools/dotnet-ef" migrations bundle \
            --project src/ClaimsModule.Persistence/ClaimsModule.Persistence.csproj \
            --startup-project src/ClaimsModule.API/ClaimsModule.API.csproj \
            --context ClaimsDbContext --configuration Release \
            --self-contained --target-runtime linux-x64 --output "$job_path/efbundle"
          install -m 755 .github/scripts/run-claims-migrations.sh "$job_path/run.sh"

      - name: Package the API
        run: tar -czf claims-api.tar.gz -C publish .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: claims-api.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: claimsmodule-production
      cancel-in-progress: false
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Extract the API
        run: |
          mkdir publish
          tar -xzf claims-api.tar.gz -C publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_118607064AD64B29BF2266951E904D21 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D87C70407C4B4D83B9036D611CF9440B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_99F6399FB5574C10A8BB6964BF38048D }}

      - name: Configure the demo API and Linux WebJobs agent
        run: |
          az webapp config appsettings set --resource-group test --name ClaimsModule \
            --settings WEBSITE_SKIP_RUNNING_KUDUAGENT=false Authentication__Demo__AllowRegistration=true --output none

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ClaimsModule'
          slot-name: 'Production'
          package: publish
          startup-command: 'cd /home/site/wwwroot && chmod +x ClaimsModule.API && exec ./ClaimsModule.API'


      - name: Apply EF Core migrations from App Service
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          RG="test"
          APP="ClaimsModule"
          JOB="claims-migrations"

          app_id=$(az webapp show \
            --resource-group "$RG" \
            --name "$APP" \
            --query id -o tsv)

          job_url="https://management.azure.com${app_id}/triggeredwebjobs/${JOB}?api-version=2025-05-01"

          echo "Waiting for migration WebJob..."

          job_info=""

          for attempt in {1..24}; do
            if job_info=$(az rest \
              --method get \
              --url "$job_url" \
              --only-show-errors 2>/dev/null); then
              break
            fi

            sleep 10
          done

          if [ -z "$job_info" ]; then
            echo "::error::Migration WebJob unavailable"
            exit 1
          fi

          previous_run=$(jq -r \
            '.properties.latest_run.url // empty' \
            <<< "$job_info")

          previous_status=$(jq -r \
            '.properties.latest_run.status // empty' \
            <<< "$job_info")

          if [ "$previous_status" = "Running" ]; then
            echo "::error::A migration WebJob is already running"
            exit 1
          fi

          echo "Starting EF Core migrations..."

          az webapp webjob triggered run \
            --resource-group "$RG" \
            --name "$APP" \
            --webjob-name "$JOB" \
            --output none

          echo "Waiting for migration result..."

          for attempt in {1..40}; do
            if ! job_info=$(az rest \
              --method get \
              --url "$job_url" \
              --only-show-errors 2>/dev/null); then

              echo "WebJob status temporarily unavailable"
              sleep 10
              continue
            fi

            run=$(jq -r \
              '.properties.latest_run.url // empty' \
              <<< "$job_info")

            status=$(jq -r \
              '.properties.latest_run.status // empty' \
              <<< "$job_info")

            if [ -n "$run" ] && [ "$run" != "$previous_run" ]; then
              case "$status" in
                Success)
                  echo "EF Core migrations succeeded"
                  exit 0
                  ;;
                Failed|Error|Aborted)
                  echo "::error::EF Core migrations failed: $status"
                  exit 1
                  ;;
                Running)
                  echo "Migrations still running..."
                  ;;
              esac
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for migrations"
          exit 1
      
      - name: Verify successful deploy
        env:
          WEBAPP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 "${WEBAPP_URL%/}/api/health"


